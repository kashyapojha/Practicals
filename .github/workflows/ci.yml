
name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: echo "Building HTML, CSS and JavaScript project"

      - name: Test
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All tests passed successfully"